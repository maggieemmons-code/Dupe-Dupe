<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dupe Dupe · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#444444}
input::placeholder{color:#6B6B6B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0A0A0A; box-sizing: border-box">

<div style="position: absolute; left: 0; right: 0; top: 30px; text-align: center; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.34em; padding-left: 0.34em">DUPE DUPE</div>

<div style="position: absolute; left: 24px; right: 24px; top: 150px">
<h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 44px; line-height: 1.0; letter-spacing: -0.03em">Replicate the look.</h1>
<p style="margin: 14px 0 0; font-size: 15px; line-height: 1.5; color: #6B6B6B">Drop in a piece you love. Get new dupes under budget and secondhand matches, judged on look and fit.</p>
</div>

<sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 24px; right: 24px; top: 380px; display: flex; flex-direction: column; gap: 12px">
<label for="email" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B6B">Your email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" value="{{email}}" onChange="{{onEmail}}" style="height: 52px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #0A0A0A; padding: 0 20px; font-family: Inter, sans-serif; font-size: 16px; color: #0A0A0A; outline: none; background: #FFFFFF">
<button onClick="{{send}}" style="height: 52px; border-radius: 999px; border: 0; background: #0A0A0A; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">Email me a sign-in link</button>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: #6B6B6B; text-align: center">Invite only. The link works on any device.</p>
</div>
</sc-if>

<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 24px; right: 24px; top: 380px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 20px; border-radius: 24px; border: 1.5px dashed #0A0A0A; text-align: center">
<div style="width: 56px; height: 56px; border-radius: 28px; background: #0A0A0A; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect><path d="M4 7l8 6 8-6" stroke-linecap="round"></path></svg>
</div>
<div style="font-family: 'Inter Tight', Inter, sans-serif; font-weight: 700; font-size: 20px">Check your inbox</div>
<div style="font-size: 14px; line-height: 1.45; color: #4A4A4A">We sent a sign-in link to <strong style="color: #0A0A0A">{{emailShown}}</strong>. It comes from login@dupedupe.studio.</div>
<button onClick="{{reset}}" style="margin-top: 4px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #0A0A0A; background: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; color: #0A0A0A">Use a different email</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', sent: false };
  }
  renderVals() {
    const s = this.state;
    return {
      asking: !s.sent,
      sent: s.sent,
      email: s.email,
      emailShown: s.email.trim() || 'your email',
      onEmail: (e) => this.setState({ email: e.target.value }),
      send: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
