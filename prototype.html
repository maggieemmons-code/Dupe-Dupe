<title>Dupe Dupe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky swing-tag photo rail left, ticket-stub stepper + one tag card right; stacks on phones */
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#1D1C1A; --muted:#857E74; --line:#E2DCD1;
  --sage:#6F7E61; --sage-soft:#EBEFE6; --clay:#B8653F; --clay-soft:#F5E9E1; --warn:#9A3B2B;
  --display:'Oswald','Arial Narrow',sans-serif; --body:'Work Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171614;--card:#211F1C;--ink:#EEEAE3;--muted:#A39B90;--line:#36322D;--sage:#9DAE8C;--sage-soft:#262B22;--clay:#DB8C66;--clay-soft:#33251E;--warn:#E07A66;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171614;--card:#211F1C;--ink:#EEEAE3;--muted:#A39B90;--line:#36322D;--sage:#9DAE8C;--sage-soft:#262B22;--clay:#DB8C66;--clay-soft:#33251E;--warn:#E07A66;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.08em}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:400;margin-left:8px}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.body{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.body{grid-template-columns:1fr}}
aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){aside{position:static}}
.tag{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:26px 16px 16px;position:relative}
.tag::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;border:3px solid var(--muted);background:var(--paper)}
.frame{border:1px dashed var(--line);border-radius:3px;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-family:var(--mono);font-size:12px;text-align:center;padding:12px}
.frame img{width:100%;height:300px;object-fit:cover;display:block}
.frame.has{padding:0;border-style:solid}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumbs button{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;background:none}
.thumbs button.on{outline:2px solid var(--sage);outline-offset:1px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.summary{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.summary h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
.summary dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.summary dt{color:var(--muted)} .summary dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.ticket{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tk{padding:12px 6px;text-align:center;border-right:1px dashed var(--line);display:flex;flex-direction:column;gap:2px;background:none;border-top:0;border-bottom:0;border-left:0;color:var(--ink);cursor:pointer;font:inherit}
.tk:last-child{border-right:0}
.tk .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tk .l{font-family:var(--display);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.tk.active{background:var(--sage);color:var(--card)} .tk.active .n{color:var(--card)}
.tk.done .l,.tk.done .n{color:var(--clay)}
.tk:disabled{cursor:default}
@media (max-width:560px){.tk .l{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:28px}
@media (max-width:560px){.card{padding:18px}}
h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 22px;max-width:60ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span:first-child{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.hint{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer}
.pill:hover{border-color:var(--sage)}
.pill.on{background:var(--sage);border-color:var(--sage);color:var(--card)}
.drop{border:1px dashed var(--line);border-radius:4px;padding:28px 16px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover,.drop.over{border-color:var(--sage);background:var(--sage-soft)}
.drop strong{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 240px}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.links li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;font-size:13px;min-width:0}
.links .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--sage);border-color:var(--sage)} .chip.bad{color:var(--warn);border-color:var(--warn)} .chip.wait{color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.note{padding:14px 16px;background:var(--clay-soft);border-left:3px solid var(--clay);border-radius:0 3px 3px 0;font-size:13px}
.note b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);font-weight:500;margin-bottom:6px}
.note ul{margin:0;padding-left:18px}
.found{border:1px solid var(--sage);background:var(--sage-soft);border-radius:4px;padding:14px 16px;font-size:13px}
.found b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);display:block;margin-bottom:6px}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:12px 26px;border-radius:3px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn:hover:not(:disabled){background:var(--sage);border-color:var(--sage)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink);background:transparent}
.btn.sm{padding:9px 16px;font-size:13px}
button:focus-visible,.tk:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.results{grid-template-columns:1fr}}
.dupe{border:1px solid var(--line);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:6px}
.dupe .top{display:flex;justify-content:space-between;align-items:flex-start}
.score{font-family:var(--display);font-size:30px;font-weight:600;color:var(--sage);line-height:1}
.score small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;margin-top:4px}
.rate{font-size:13px;color:var(--clay);font-variant-numeric:tabular-nums}
.rate span{color:var(--muted)}
.dupe h3{font-family:var(--display);font-weight:500;font-size:18px;margin:4px 0 0}
.ret{color:var(--muted);font-size:13px;margin:0}
.price{font-family:var(--mono);font-size:16px;margin:0}
.comp{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0}
.why{font-size:13px;margin:4px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--clay-soft);color:var(--clay)}
.shop{margin-top:auto;padding-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.shop a{font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
.shop a:hover{color:var(--sage);border-color:var(--sage)}
.hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{font-family:var(--display);font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:7px 16px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer}
.tab.on{background:var(--ink);color:var(--paper)}
.item-line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--line);border-radius:4px;font-size:14px}
.item-line strong{font-family:var(--display);font-weight:500;font-size:17px}
.sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0;font-weight:500}
.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qtype{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
.qtext{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.qwhy{font-size:13px;color:var(--muted);margin:0}
.plinks{display:flex;flex-wrap:wrap;gap:6px}
.plink{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:3px;color:var(--ink);text-decoration:none;background:var(--paper)}
.plink:hover{border-color:var(--sage);color:var(--sage)}
.brands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.brands{grid-template-columns:1fr}}
.era{font-family:var(--mono);font-size:11px;color:var(--sage)}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;margin-top:8px}
.fb textarea{min-height:70px}
.vote{font-size:16px;line-height:1;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer}
.vote:hover{border-color:var(--sage)}
.fbdone{font-size:13px;flex:1;min-width:0;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:0}
.scope-tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.kind.new{background:var(--clay-soft);color:var(--clay)}
.kind.used{background:var(--sage-soft);color:var(--sage)}
.kinds{display:flex;gap:4px}
.kind.fav{background:var(--clay-soft);color:var(--clay)}
.prefrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.linkbtn.faved{color:var(--clay);text-decoration:none;font-weight:600}
.pchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pchips .sec-h{margin:0 6px 0 0}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 6px 5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.pchip.favorites{border-color:var(--clay);color:var(--clay)}
.pchip.excluded{color:var(--muted);text-decoration:line-through}
.pchip button{background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:0 4px;text-decoration:none}
.kind.live{background:var(--ink);color:var(--paper)}
.disclose{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
details.msel{position:relative}
details.msel summary{list-style:none;cursor:pointer;font-size:14px;padding:10px 32px 10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.msel summary::-webkit-details-marker{display:none}
details.msel summary::after{content:"▾";position:absolute;right:12px;top:10px;color:var(--muted)}
details.msel[open] summary{outline:2px solid var(--sage);outline-offset:1px}
details.msel .ph{color:var(--muted)}
.mopts{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow:auto;padding:6px}
.mopts label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:3px;font-size:14px;cursor:pointer}
.mopts label:hover{background:var(--sage-soft)}
.mopts input{width:auto;accent-color:var(--sage)}
.sortbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.sortbar .sec-h{margin:0}
.clr{font-weight:500;color:var(--ink)}
.diffclr{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--clay-soft);color:var(--clay);white-space:nowrap}
.scores{display:flex;gap:16px}
.jnote{font-size:13px;margin:4px 0;padding:8px 10px;background:var(--sage-soft);border-radius:3px}
.jnote b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:500}
.kind.photo{background:var(--sage-soft);color:var(--sage)}
.learn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--sage);margin:0 0 14px}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:18px}
.status.err{color:var(--warn)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 0;color:var(--muted);font-family:var(--mono);font-size:12px;text-align:center}
.bar{width:180px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar::after{content:"";display:block;width:40%;height:100%;background:var(--sage);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar::after{animation:none;width:100%}}
.brandbtn{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:inherit}
.home{display:flex;flex-direction:column;gap:32px;max-width:860px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);margin:0 0 10px}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,6vw,54px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin:0 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--sage)}
.lede{color:var(--muted);font-size:16px;max-width:58ch;margin:0}
.starter{display:flex;flex-direction:column;gap:14px;padding:30px 22px 22px}
.starter textarea{min-height:64px;font-size:16px}
.starter .drop{padding:16px}
.newthumbs{display:flex;gap:6px;flex-wrap:wrap}
.newthumbs img{width:48px;height:48px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.recent-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.recent-h h2{font-size:20px;margin:0}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:4px;display:flex;gap:12px;padding:12px;align-items:center;min-width:0;position:relative}
.rcard:hover{border-color:var(--sage)}
.rthumb{width:64px;height:64px;flex-shrink:0;border-radius:3px;overflow:hidden;background:var(--sage-soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:var(--sage)}
.rthumb img{width:100%;height:100%;object-fit:cover}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ropen{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--display);font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ropen::after{content:"";position:absolute;inset:0}
.rmeta{font-size:12px;color:var(--muted)}
.rstate{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage)}
.rstate.run{color:var(--clay)}
.rdel{position:relative;z-index:1;align-self:flex-start;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px}
.rdel.confirm{color:var(--warn);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:4px;padding:28px;text-align:center;color:var(--muted)}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shead h2{margin:0}
.tabs.in{align-self:flex-start;border-radius:999px}
.tab .q{font-family:var(--mono);font-size:9px;letter-spacing:.08em;margin-left:6px;padding:2px 6px;border-radius:999px;background:var(--sage-soft);color:var(--sage)}
.tab.on .q{background:var(--sage);color:var(--card)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--clay);margin-left:6px;vertical-align:middle;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.tab .dot{animation:none}}
.review dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px 16px;margin:0 0 22px;font-size:14px}
.review dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.review dd{margin:0;overflow-wrap:anywhere}
.review dd.miss{color:var(--muted);font-style:italic}

    <button class="brand brandbtn" id="homeBtn" aria-label="Dupe Dupe home">DUPE DUPE</button>

<script>
const STEPS=["Sources","Item Info","Sizing & Fit","Fabric","Design Details"];
const CATS=["Dress","Top / Blouse","Sweater / Knit","Outerwear","Bottoms","Denim","Activewear","Shoes","Bag / Accessory"];
const FITS=["Slim","Relaxed","Oversized","Tailored","Cropped","Bodycon"];
const STRETCH=["None","Slight","Moderate","Very stretchy"];

function fabricWord(f){const t=(f.productName+" "+f.composition+" "+f.features).toLowerCase();
  for(const w of ["jacquard","satin","velvet","silk","linen","cashmere","wool","lace","tweed","crepe","leather","denim","knit","cotton"])if(t.includes(w))return w;return ""}
function catWord(f){const c=f.category;return {"Top / Blouse":"top","Sweater / Knit":"sweater","Bag / Accessory":"bag","Bottoms":"pants","Outerwear":"coat"}[c]||(c||"").toLowerCase()}
function baseQueries(f){const fw=fabricWord(f),cw=catWord(f),out=[];
  if(f.brand&&f.productName)out.push({label:"Exact item",q:join(f.brand,f.productName,f.color),why:"Finds listings that kept the official name."});
  if(f.brand)out.push({label:"Brand + description",q:join(f.brand,f.color,fw,cw),why:"Resellers often drop the style name. This catches those."});
  const desc=join(f.color,fw,f.neckline&&f.neckline!=="None"?f.neckline:"",cw);
  if(desc)out.push({label:"Look-alike, any brand",q:desc,why:"Surfaces older or unbranded pieces with the same look."});
  return out}

    <label class="field"><span>Listing text</span><textarea id="pasteIn" placeholder="Paste the Details, Fabric & Care and Size & Fit sections from the product page">${esc(s.pasted)}</textarea><span class="hint">The most reliable source when a page can't be opened here.</span></label>
    <div class="row" style="align-items:center"><button class="btn" id="reread"${s.busyRead?" disabled":""}>${s.busyRead?"Reading…":"Read sources again"}</button><span class="status${s.err?" err":""}">${esc(s.err)}</span></div></div>`;break;
  case 1:body=`<h2>What it is</h2><p class="sub">The basics narrow the search.</p><div class="grid2">
    ${input("brand","Brand name","e.g. Sau Lee")}${input("productName","Product name","e.g. Joanna Jacquard Gown")}
    ${select("category","Category",CATS,"Choose a category")}${input("originalPrice","Original price ($)","750","","decimal")}
    ${input("maxBudget","Max dupe budget ($)","150","New dupes over this price are left out","decimal")}</div>`;break;

    <p class="sec-h" style="margin:24px 0 10px">Measurements (optional, inches)</p><div class="grid3">
    ${select("bust","Bust / chest",MEAS.bust,"Select")}${select("waist","Waist",MEAS.waist,"Select")}${select("hip","Hip",MEAS.hip,"Select")}</div>
    ${s.scraped?.sizeNotes?`<div class="found" style="margin-top:18px"><b>Fit notes from the listing</b>${esc(s.scraped.sizeNotes)}</div>`:""}`;break;
  case 3:body=`<h2>Fabric composition</h2><p class="sub">From the care label or the Fabric & Care section of the listing.</p><div class="stack">
    ${pills("fabrics","Fibers present",FABRICS)}${input("composition","Exact composition","e.g. 95% Cotton, 5% Elastane")}${pills("care","Care instructions",CARE)}
    <div class="note"><b>Why this matters</b>A dry clean only tag usually signals a higher tier. Secondhand is often where you get that tier at a fraction of the price.</div></div>`;break;
  case 4:body=`<h2>Design details</h2><p class="sub">The finer points that separate a close match from a near miss.</p><div class="stack">
    ${input("color","Color / pattern","e.g. Burnt red jacquard")}${pills("vibes","Style vibe",VIBES,3)}

  return {ticket:`<nav class="ticket" aria-label="Detail sections">${STEPS.map((x,i)=>`<button class="tk ${i===s.step?"active":"done"}" data-go="${i}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="l">${x}</span></button>`).join("")}</nav>`,
    body,nav:`<button class="btn ghost" id="back"${s.step===0?" disabled":""}>Back</button><div class="row" style="align-items:center"><span class="status" id="savedNote">${G.saved?"Saved":""}</span>

}

function thriftHTML(s){

  <div class="stack">
    <div class="field"><span>Sites to search</span><div class="pills">${PLATFORMS.map(p=>`<button type="button" class="pill${G.plat.includes(p.id)?" on":""}" data-plat="${p.id}" title="${esc(p.best)}">${esc(p.name)}</button>`).join("")}</div></div>
    ${s.busyPlan?`<div class="inline-load"><div class="bar"></div>Building your secondhand plan. Starter searches below work now.</div>`:""}

    <div class="qlist">${qs.map(qRow).join("")}</div>
    ${s.plan?.brands?.length?`<p class="sec-h">Older labels worth checking</p><div class="brands">${s.plan.brands.map(b=>`<div class="qrow"><span class="qtype">${esc(b.name)}</span>${b.era?`<span class="era">Best era: ${esc(b.era)}</span>`:""}<p class="qwhy">${esc(b.why)}</p><span class="qtext">${esc(b.q)}</span>${linksFor(b.q)}</div>`).join("")}</div>`:""}
    ${s.plan?.checks?.length?`<div class="note"><b>Check every listing for</b><ul>${s.plan.checks.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>${s.plan.priceNote?`<p style="margin:8px 0 0">${esc(s.plan.priceNote)}</p>`:""}</div>`:""}
    ${!s.busyPlan?`<button class="btn ghost sm" id="replan" style="align-self:flex-start">${s.plan?"Rebuild plan":"Build secondhand plan"}</button>`:""}

}

function fbHTML(d){const k=fbKey(d),fb=FB.find(x=>x.id===k);
  if(fb)return `<div class="fb"><span class="fbdone">${fb.vote==="up"?"👍 Good dupe":"👎 Not a dupe"}${fb.reason?": "+esc(fb.reason):""} <span class="scope-tag">${fb.scope==="item"?"This item":"My taste"}</span></span><button class="linkbtn" data-fbundo="${k}">Change</button></div>`;
  if(G.fbOpen&&G.fbOpen.k===k){const up=G.fbOpen.vote==="up";return `<div class="fb" style="flex-direction:column;align-items:stretch"><label class="field"><span>${up?"What makes it work? (optional)":"What's different from the original?"}</span><textarea id="fbr-${k}" placeholder="${up?"e.g. the neckline and length are right, a slightly different red is fine":"e.g. neckline is too low, skirt flares instead of a column, sheen looks cheap"}"></textarea></label>
    <div class="field"><span>Apply this to</span><div class="pills"><button type="button" class="pill${G.fbScope!=="item"?" on":""}" data-scope="taste">My taste overall</button><button type="button" class="pill${G.fbScope==="item"?" on":""}" data-scope="item">Just this item</button></div>
    <span class="hint">${G.fbScope==="item"?"Used only when searching for this piece.":"Teaches how literal you are about a match on every future search."}</span></div>
    <div class="row"><button class="btn sm" data-fbsave="${k}">Save</button><button class="btn ghost sm" data-fbcancel="1">Cancel</button></div></div>`}
  return `<div class="fb"><button class="vote" data-fbup="${k}" aria-label="Good dupe">👍</button><button class="vote" data-fbdown="${k}" aria-label="Not a good dupe">👎</button><span class="hint">Rate it so future picks fit your taste</span></div>`}

const VIEWS=[["all","All by price"],["new","New only"],["used","Secondhand only"]];
const priceNum=p=>{const n=parseFloat(String(p??"").replace(/[^0-9.]/g,""));return isNaN(n)?Infinity:n};
const usedItems=s=>(s.plan?.items||[]);
const asUsedRef=x=>({name:x.name,retailer:"Secondhand",price:x.estLow?"$"+x.estLow:""});
function tunedLine(s){const {taste,item}=fbSplit(s);const parts=[];if(taste.length)parts.push(`${taste.length} taste note${taste.length>1?"s":""}`);if(item.length)parts.push(`${item.length} for this item`);if(PREFS.favorites.length)parts.push(`${PREFS.favorites.length} favorite${PREFS.favorites.length>1?"s":""}`);if(PREFS.excluded.length)parts.push(`${PREFS.excluded.length} hidden`);return parts.length?`<p class="learn">Tuned by ${parts.join(" · ")}</p>`:""}
function scoreHTML(x,label){if(x.look!=null)return `<div class="scores"><div class="score">${Math.round(x.look)}%<small>Look</small></div><div class="score">${Math.round(x.fitScore??0)}%<small>Fit</small></div></div>`;
  return `<div class="score">${Math.round(x.fit||0)}%<small>${esc(label)}</small></div>`}
const judgeLine=x=>x.jnote?`<p class="jnote"><b>Judge${x.conf&&x.conf!=="high"?` · ${esc(x.conf)} confidence`:""}:</b> ${esc(x.jnote)}</p>`:"";
const srcTag=x=>x.byPhoto?`<span class="kind photo">Photo match</span>`:"";
const metaLine=(brand,size,extra,x)=>{const bits=[brand?esc(brand):"",x.color?`<span class="clr">${esc(x.color)}</span>${x.sameColor===false?` <span class="diffclr">Different color</span>`:""}`:"",size?esc(size):"",extra?esc(extra):""].filter(Boolean);return `<p class="ret">${bits.join(" · ")}</p>`};
function newCard(d){
  const q=encodeURIComponent(`${d.retailer} ${d.query||d.name}`),terms=d.query||d.name,dom=(d.retailerDomain||"").replace(/^https?:\/\//,"").replace(/^www\./,"").split("/")[0];
  const direct=dom?`https://duckduckgo.com/?q=${encodeURIComponent("!ducky site:"+dom+" "+terms)}`:"",site=dom?retailerSearch(dom,terms):"";
  return `<article class="dupe"><div class="top">${scoreHTML(d,"match")}<span class="kinds">${srcTag(d)}${isFav(d.retailer)?`<span class="kind fav">★</span>`:""}${d.live?`<span class="kind live">Live price</span>`:""}<span class="kind new">New</span></span></div>
  <h3>${esc(d.name)}</h3>${metaLine(d.retailer,d.size?"Sizes "+d.size:"","",d)}<p class="price">${esc(d.price)}</p><p class="comp">${esc(d.composition)}</p>
  <div class="badges">${(d.badges||[]).slice(0,3).map(b=>`<span class="badge">${esc(b)}</span>`).join("")}</div>${judgeLine(d)}<p class="why">${esc(d.why)}</p>
  <div class="shop">${d.url?`<a href="${esc(aff(d.url))}" target="_blank" rel="noopener sponsored">View this item</a>`:`${direct?`<a href="${direct}" target="_blank" rel="noopener">View this item</a>`:""}${site?`<a href="${site}" target="_blank" rel="noopener">Search ${esc(d.retailer)}</a>`:""}`}<a href="https://www.google.com/search?tbm=shop&q=${q}" target="_blank" rel="noopener">Compare prices</a></div>${prefBtns(d.retailer)}${fbHTML(d)}</article>`}
function usedCard(x){
  const kind={exact:"Exact piece",visual:"Look match",label:"Older label"}[x.kind]||"Look match";
  const est=x.estLow&&x.estHigh?`Est. $${x.estLow}–$${x.estHigh}`:x.estLow?`Est. from $${x.estLow}`:"Price varies";
  return `<article class="dupe"><div class="top">${scoreHTML(x,kind)}<span class="kinds">${isFav(x.brand)?`<span class="kind fav">★</span>`:""}<span class="kind used">Secondhand</span></span></div>
  <h3>${esc(x.name)}</h3>${metaLine(x.brand||"Any brand","",x.era,x)}<p class="price">${esc(est)}</p>${x.composition?`<p class="comp">${esc(x.composition)}</p>`:""}
  ${judgeLine(x)}<p class="why">${esc(x.why)}</p><span class="qtext">${esc(x.q)}</span>${linksFor(x.q)}${prefBtns(x.brand)}${fbHTML(asUsedRef(x))}</article>`}
function loadLine(on,t){return on?`<div class="inline-load"><div class="bar"></div>${t}</div>`:""}
function errs(s,which){return [which!=="used"&&s.dupeErr,which!=="new"&&s.planErr].filter(Boolean).map(e=>`<p class="status err">${esc(e)}</p>`).join("")}
const SORTS=[["look","Best look"],["fit","Best fit"],["low","Price: low to high"],["high","Price: high to low"]];
function cmp(a,b){const lo=x=>x===Infinity||x==null||isNaN(x)?null:x,pa=lo(a.p),pb=lo(b.p);
  if(G.sort==="low"||G.sort==="high"){if(pa==null&&pb==null)return (b.f||0)-(a.f||0);if(pa==null)return 1;if(pb==null)return -1;return G.sort==="low"?pa-pb:pb-pa}
  return ((b.f||0)-(a.f||0))||((pa??1e9)-(pb??1e9))}
const scoreFor=x=>G.sort==="fit"?(x.fitScore??x.fit):(x.look??x.fit);
const sortList=(list,p,f)=>[...list].map(x=>({x,p:p(x),f:f(x)})).sort(cmp).map(o=>o.x);
function sortBar(){return `<div class="sortbar"><span class="sec-h">Sort by</span><div class="pills">${SORTS.map(([v,l])=>`<button type="button" class="pill${G.sort===v?" on":""}" data-sort="${v}">${l}</button>`).join("")}</div></div>`}
function allHTML(s){
  const cards=[...shownNew(s).map(d=>({p:priceNum(d.price),f:scoreFor(d),h:newCard(d)})),...shownList(s).map(x=>({p:x.price??Infinity,f:scoreFor(x),h:listingCard(x)})),...(shownList(s).length?[]:shownUsed(s).map(x=>({p:priceNum(x.estLow),f:scoreFor(x),h:usedCard(x)})))].sort(cmp);
  if(!cards.length&&(s.busyDupe||s.busyPlan||s.busyList))return `<div class="loading"><div class="bar"></div>Finding new and secondhand matches</div>`;
  return `${staleBanner(s)}<p class="sub" style="margin-bottom:12px">New and secondhand together. Cards marked Live show today's price. Anything without that tag is an estimate.</p>
  ${loadLine(s.judging,"Judge is checking each match against your photo…")}${loadLine(s.busyDupe&&!s.judging,"Still finding new dupes…")}${loadLine(s.busyList,"Reading live resale listings…")}${loadLine(s.busyPlan&&!shownList(s).length,"Still finding secondhand matches…")}${errs(s,"all")}${tunedLine(s)}${hiddenNote(s,"all")}
  ${cards.length>1?sortBar():""}${cards.length?`<div class="results">${cards.map(c=>c.h).join("")}</div>`:`<div class="empty">No matches yet.</div>`}
  <div class="row" style="margin-top:18px">${!s.busyDupe?`<button class="btn ghost sm" id="redupe">Refresh new</button>`:""}${!s.busyList?`<button class="btn ghost sm" id="relist">Refresh secondhand</button>`:""}</div>`}
function newHTML(s){
  const r=sortList(shownNew(s),d=>priceNum(d.price),scoreFor);
  if(s.busyDupe&&!r.length)return `<div class="loading"><div class="bar"></div>Matching fabric, fit and details${s.form.maxBudget?` under $${esc(s.form.maxBudget)}`:""}</div>`;
  return `${staleBanner(s)}<p class="sub" style="margin-bottom:12px">New look-alikes you can buy now. Confirm price, stock and fiber content on each listing.</p>
  ${loadLine(s.judging,"Judge is checking each match against your photo…")}${loadLine(s.busyDupe&&!s.judging,"Refreshing…")}${errs(s,"new")}${tunedLine(s)}${hiddenNote(s,"new")}
  ${r.length>1?sortBar():""}${r.length?`<div class="results">${r.map(newCard).join("")}</div>`:`<div class="empty">No new dupes yet.</div>`}
  ${s.tips?.length?`<div class="note" style="margin-top:20px"><b>Before you buy</b><ul>${s.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
  ${!s.busyDupe?`<button class="btn ghost sm" id="redupe" style="margin-top:18px">Search again</button>`:""}`}
function usedHTML(s){
  const items=sortList(shownUsed(s),x=>priceNum(x.estLow),scoreFor);
  const live=sortList(shownList(s),x=>x.price??Infinity,scoreFor);
  if(s.busyPlan&&s.busyList&&!items.length&&!live.length)return `<div class="loading"><div class="bar"></div>Reading live listings on resale sites</div>`;
  return `${staleBanner(s)}${errs(s,"used")}${s.listErr?`<p class="status err">${esc(s.listErr)}</p>`:""}${tunedLine(s)}${hiddenNote(s,"used")}
  ${loadLine(s.busyList,"Reading live resale listings…")}
  ${live.length+items.length>1?sortBar():""}${live.length?`<div class="recent-h"><p class="sec-h">Live listings</p><span class="hint">Read ${esc(ago(s.listedAt||Date.now()))}${!s.busyList?` · <button class="linkbtn" id="relist">Refresh</button>`:""}</span></div><div class="results" style="margin-bottom:28px">${live.map(listingCard).join("")}</div>`:(!s.busyList&&!s.listings?`<button class="btn sm" id="relist" style="margin-bottom:22px">Find live listings</button>`:"")}
  ${items.length?`<p class="sec-h" style="margin-bottom:12px">${live.length?"More to look for (estimated prices)":"What to look for (estimated prices)"}</p><div class="results" style="margin-bottom:28px">${items.map(usedCard).join("")}</div>`:""}${thriftHTML(s)}`}
function ensureRun(s){const v=s.tab;
  if((v==="all"||v==="new")&&!s.results&&!s.busyDupe)findDupes(s);
  if((v==="all"||v==="used")&&!s.plan&&!s.busyPlan)buildPlan(s);
  if((v==="all"||v==="used")&&!s.listings&&!s.busyList&&mcpNS)findListings(s)}

function searchHTML(s){
  let tabs="",card="",nav="",ticket="";
  if(!s.reviewed){card=reviewHTML(s)}
  else{
    const dot=v=>(v!=="used"&&s.busyDupe&&v!=="details")||(v!=="new"&&(s.busyPlan||s.busyList)&&v!=="details")?`<span class="dot"></span>`:"";
    tabs=`<div class="tabs in" role="tablist">${[...VIEWS,["details","Details"]].map(([v,l])=>`<button class="tab${s.tab===v?" on":""}" data-tab="${v}" role="tab">${l}${dot(v)}</button>`).join("")}</div>`;
    if(s.tab==="all")card=allHTML(s);
    else if(s.tab==="new")card=newHTML(s);
    else if(s.tab==="used")card=usedHTML(s);
    else{const d=detailsHTML(s);ticket=d.ticket;card=d.body;nav=d.nav}
  }
  return `<div class="body">${asideHTML(s)}<main>
    <div class="shead"><div><p class="eyebrow" style="margin-bottom:4px">${s.reviewed?"Search":"New search"}</p><h2>${esc(nameOf(s))}</h2></div>${s.reviewed&&s.tab!=="details"?`<button class="btn ghost sm" id="editDetails">Edit details</button>`:""}</div>
    ${tabs}${ticket}<div class="card">${card}</div>${nav?`<div class="nav">${nav}</div>`:""}</main></div>`;
}

function render(){
  G.dirty=false;
  const dc=$("#disclose");if(dc){dc.hidden=!affOn();dc.textContent=AFF.disclosure}
  const hr=$("#hright");
  if(G.view==="home"){
    const running=Object.values(SEARCHES).filter(isBusy).length;
    hr.innerHTML=running?`<span class="meta">${running} search${running>1?"es":""} running</span>`:"";
    $("#app").innerHTML=homeHTML();
  }else{
    const s=cur();if(!s){G.view="home";return render()}
    const others=Object.values(SEARCHES).filter(x=>x.id!==s.id&&isBusy(x)).length;
    hr.innerHTML=`${others?`<span class="meta">${others} other running</span>`:""}<button class="btn ghost sm" id="toHome">All searches</button><button class="btn sm" id="newBtn">New search</button>`;
    $("#app").innerHTML=searchHTML(s);
  }
  bind();
}

/* ---------- events ---------- */
function bind(){
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  on("#homeBtn",()=>{G.view="home";G.delConfirm=null;render()});
  on("#toHome",()=>{G.view="home";G.delConfirm=null;render()});
  on("#newBtn",()=>{G.view="home";render();const h=$("#homeIn");if(h)h.focus()});
  const sf=$("#startForm");if(sf)sf.onsubmit=e=>{e.preventDefault();startSearch()};
  const hi=$("#homeIn");if(hi){hi.oninput=()=>{G.homeText=hi.value};hi.onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();startSearch()}}}
  const dr=$("#drop");if(dr){dr.onclick=()=>{photoTarget=null;$("#fileIn").click()};dr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();photoTarget=null;$("#fileIn").click()}};
    dr.ondragover=e=>{e.preventDefault();dr.classList.add("over")};dr.ondragleave=()=>dr.classList.remove("over");dr.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files,null)}}
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{G.curId=b.dataset.open;G.view="search";G.delConfirm=null;render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.del;
    if(G.delConfirm===id){removeSearch(id);G.delConfirm=null}else G.delConfirm=id;render()});
  document.querySelectorAll("[data-unpref]").forEach(b=>b.onclick=()=>togglePref(b.dataset.list,b.dataset.unpref));
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>togglePref("favorites",b.dataset.fav));
  document.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>togglePref("excluded",b.dataset.hide));
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{G.sort=b.dataset.sort;try{localStorage.setItem("dd-sort",G.sort)}catch(e){}render()});
  if(G.view!=="search")return;
  const s=cur();
  document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{s.active=+b.dataset.ph;render()});
  on("[data-addph]",()=>{photoTarget=s;$("#fileIn").click()});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;if(s.tab!=="details"){G.viewPref=s.tab;try{localStorage.setItem("dd-view",s.tab)}catch(e){}ensureRun(s)}render()});
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{s.tab=G.viewPref=b.dataset.view;try{localStorage.setItem("dd-view",s.tab)}catch(e){}render()});
  document.querySelectorAll("[data-k]").forEach(el=>{el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{s.form[el.dataset.k]=el.value;touch(s)})});
  document.querySelectorAll("[data-mk]").forEach(cb=>cb.onchange=()=>{const k=cb.dataset.mk,cur=arr(s.form[k]);
    s.form[k]=cb.checked?[...cur.filter(x=>x!==cb.value),cb.value]:cur.filter(x=>x!==cb.value);touch(s);
    const sm=cb.closest("details").querySelector("summary");sm.textContent=s.form[k].length?s.form[k].join(", "):"Choose…"});
  document.addEventListener("click",e=>{document.querySelectorAll("details.msel[open]").forEach(d=>{if(!d.contains(e.target))d.open=false})},{once:true});
  on("#editDetails",()=>{s.tab="details";s.step=1;G.saved=false;render();window.scrollTo(0,0)});
  on("#doneEdit",()=>{persist(s);G.saved=false;s.tab=G.viewPref;render()});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const k=b.dataset.p,v=b.dataset.v,max=+b.dataset.max,a=s.form[k];
    if(a.includes(v))s.form[k]=a.filter(x=>x!==v);else if(!max||a.length<max)s.form[k]=[...a,v];touch(s);render()});
  on("#looksRight",()=>{if(s.tab==="details")s.tab=G.viewPref;runFor(s);render()});
  on("#fixDetails",()=>{s.reviewed=true;s.tab="details";s.step=1;persist(s);render()});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{s.step=+b.dataset.go;render()});
  on("#back",()=>{s.step=Math.max(0,s.step-1);render()});
  on("#next",()=>{persist(s);s.step=Math.min(4,s.step+1);G.saved=false;render();window.scrollTo(0,0)});
  document.querySelectorAll("#update").forEach(b=>b.onclick=()=>{persist(s);G.saved=false;s.tab=G.viewPref;s.results=null;s.plan=null;s.listings=null;runFor(s);render();window.scrollTo(0,0)});
  const lf=$("#linkForm");if(lf)lf.onsubmit=e=>{e.preventDefault();const v=$("#linkIn").value.trim();
    if(!/^https?:\/\//i.test(v)){s.err="Enter a full link starting with https://";render();return}
    const item={url:v,state:"",msg:""};s.links.push(item);persist(s);readLink(s,item)};
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{s.links.splice(+b.dataset.rm,1);persist(s);render()});
  const pi=$("#pasteIn");if(pi)pi.oninput=()=>{s.pasted=pi.value;clearTimeout(s._t);s._t=setTimeout(()=>persist(s),800)};
  on("#reread",async()=>{await Promise.all(s.links.filter(l=>!l.text).map(l=>readLink(s,l)));extract(s)});
  on("#replan",()=>buildPlan(s));
  document.querySelectorAll("#relist").forEach(b=>b.onclick=()=>findListings(s));
  on("#redupe",()=>findDupes(s));
  document.querySelectorAll("[data-plat]").forEach(b=>b.onclick=()=>{const id=b.dataset.plat;
    G.plat=G.plat.includes(id)?G.plat.filter(x=>x!==id):[...G.plat,id];try{localStorage.setItem("df-plat",JSON.stringify(G.plat))}catch(e){}render()});
  const dupeFor=k=>[...(s.results||[]),...usedItems(s).map(asUsedRef),...(s.listings||[]).map(asListRef)].find(d=>fbKey(d)===k);
  const openFb=(k,vote)=>{G.fbOpen={k,vote};render();const t=document.getElementById("fbr-"+k);if(t)t.focus()};
  document.querySelectorAll("[data-fbup]").forEach(b=>b.onclick=()=>openFb(b.dataset.fbup,"up"));
  document.querySelectorAll("[data-fbdown]").forEach(b=>b.onclick=()=>openFb(b.dataset.fbdown,"down"));
  document.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{const t=G.fbOpen&&document.getElementById("fbr-"+G.fbOpen.k),keep=t?t.value:"";G.fbScope=b.dataset.scope;try{localStorage.setItem("dd-scope",G.fbScope)}catch(e){}render();const n=G.fbOpen&&document.getElementById("fbr-"+G.fbOpen.k);if(n){n.value=keep;n.focus()}});
  document.querySelectorAll("[data-fbsave]").forEach(b=>b.onclick=()=>{const k=b.dataset.fbsave,t=document.getElementById("fbr-"+k);saveFb(s,dupeFor(k),G.fbOpen.vote,t?t.value.trim():"")});
  document.querySelectorAll("[data-fbcancel]").forEach(b=>b.onclick=()=>{G.fbOpen=null;render()});
  document.querySelectorAll("[data-fbundo]").forEach(b=>b.onclick=async()=>{const k=b.dataset.fbundo;FB=FB.filter(x=>x.id!==k);render();if(store)try{await store.doc(k).delete()}catch(e){}});
}
async function saveFb(s,d,vote,reason){if(!d){G.fbOpen=null;render();return}
  const f=s.form,body={kind:"rating",vote,reason,scope:G.fbScope==="item"?"item":"taste",searchId:s.id,dupe:d.name,retailer:d.retailer,price:d.price||"",original:join(f.brand,f.productName),category:f.category||"",at:Date.now()};
  G.fbOpen=null;FB=[...FB.filter(x=>x.id!==fbKey(d)),{id:fbKey(d),...body}];render();
  if(!store){s.dupeErr="Ratings can only be saved when you're signed in to claude.ai.";render();return}
  try{await store.doc(fbKey(d)).set(body)}catch(e){s.dupeErr="Couldn't save that rating. Try again.";render()}}
render();
</script>
